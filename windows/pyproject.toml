[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-media-remote"
description = "Show Windows Now Playing on Flipper Zero and control playback over Bluetooth LE"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "bleak>=1.0,<4",
    "Pillow>=10",
    "pycaw>=20240316; sys_platform == 'win32'",
    "winrt-runtime>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
windows-media-remote = "winmediaremote.__main__:cli"

[tool.setuptools.dynamic]
version = { attr = "winmediaremote.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
